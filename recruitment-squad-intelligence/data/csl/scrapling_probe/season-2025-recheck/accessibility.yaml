  - text: About
  - paragraph: Chinese Super League, also known as Chinese Super League, is a professional football league in China for men.
  - paragraph: There are overall 16 teams that compete for the title every year.
  - paragraph: The current holder of the title is Shanghai Port and the team that holds the most titles is Guangzhou FC.
  - paragraph: Sofascore tracks live football scores and Chinese Super League table, results, statistics and top scorers.
  - heading "Competition format of Chinese Super League" [level=2]
  - paragraph:
    - text: The teams are placed in 15 tables, with a promotion and relegation system for the best and worst-performing teams. 1 teams are relegated to the
    - link "Chinese League 1":
      - /url: https://www.sofascore.com/football/tournament/china/cfa-china-league/782
    - text: .
  - paragraph: The top 6 team qualifies for the AFC Champions League main tournament or preliminary qualifications.
  - paragraph: Additional 6 team qualify for UEFA Champions League Qualification tournament or preliminary qualifications.
  - paragraph: Additional 9 team qualify for UEFA Champions League tournament or preliminary qualifications.
  - heading "Chinese Super League top scorers" [level=2]
  - paragraph: The top scorers in the last season of Chinese Super League Chinese Super League 2025 season were Fabio Abreu.Last season top scorer is Fabio Abreu with 28 goals.
  - heading "Team stadiums and attendance" [level=2]
  - paragraph: The team with the largest stadium is Beijing Sinobo Guoan with the capacity of 66161.
  - paragraph: The average attendance per game was 24076.
  - paragraph: The highest attendance per game in the season Chinese Super League 2025 was 57056.This was during the match between Beijing Sinobo Guoan and Guangzhou Evergrande Taobao.
  - paragraph: The total attendance in Chinese Super League 2025 season was 4405999.
  - heading "TV partners" [level=2]
  - paragraph: The largest TV partners for Chinese Super League are China Central Television, PPTV, ESPN+.
  - heading "Which team in Chinese Super League has the most titles?" [level=3]
  - paragraph: The team with the most titles in Chinese Super League is Guangzhou FC.
  - heading "Which team is the current titleholder in Chinese Super League?" [level=3]
  - paragraph: The current titleholder in Chinese Super League is Shanghai Port.
  - heading "What rank of competition is Chinese Super League in China?" [level=3]
  - paragraph: Chinese Super League is professional division in China.
  - heading "How many goals are scored on average in Chinese Super League in Chinese Super League 2026?" [level=3]
  - paragraph: The average number of goals in Chinese Super League is 3.21.
  - heading "When does the Chinese Super League start and when does it finish?" [level=3]
  - paragraph: The Chinese Super League usually starts in March and ends in November.
  - heading "How many groups are there in Chinese Super League competition?" [level=3]
  - paragraph: The teams in Chinese Super League are placed in 15 groups.
